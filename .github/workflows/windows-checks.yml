name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install verified FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod 'https://api.github.com/repos/GyanD/codexffmpeg/releases/tags/9.0.2'
          $asset = $release.assets | Where-Object name -eq 'ffmpeg-9.0.2-essentials_build.7z' | Select-Object -First 1
          if (!$asset -or $asset.digest -notmatch '^sha256:([a-f0-9]{64})$') {
            throw 'FFmpeg asset or SHA-256 digest is missing'
          }
          $expected = $Matches[1]
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.7z'
          if ($asset.browser_download_url -ne $url) { throw 'Unexpected FFmpeg download URL' }
          $archive = Join-Path $env:RUNNER_TEMP 'ccc-ffmpeg.7z'
          Invoke-WebRequest $url -OutFile $archive -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $archive).Hash -ine $expected) { throw 'Invalid FFmpeg SHA-256' }
          $tools = Join-Path $env:RUNNER_TEMP 'ccc-tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          tar -xf $archive -C $tools
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract FFmpeg' }
          $bin = Join-Path $tools 'ffmpeg-9.0.2-essentials_build/bin'
          if (!(Test-Path (Join-Path $bin 'ffmpeg.exe')) -or !(Test-Path (Join-Path $bin 'ffprobe.exe'))) {
            throw 'FFmpeg tools were not extracted'
          }
          "CCC_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check dependencies and syntax
        shell: pwsh
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q creator_control tests
          exit $LASTEXITCODE
      - name: Run tests
        run: python -m unittest discover -v
